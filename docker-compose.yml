services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_emploi
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-emploi}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      # Exécution automatique à la création du conteneur (schéma + données de test)
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      # Persistance des données
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-emploi}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
