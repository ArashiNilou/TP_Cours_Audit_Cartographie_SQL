global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: tp2-python-services
    static_configs:
      - targets:
          - ft-producer:8001
          - communes-collector:8002
          - raw-aggregator:8003

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

